baseURL: "https://jphs682.github.io/jphs.github.io-web/"

title: "Diário de um Computador"

defaultContentLanguage: "pt-br"
enableEmoji: true

languages:
  pt-br:
    label: "Português"
    locale: "pt-BR"
    weight: 1

    menu:
      main:

        - name: "Início"
          pageRef: /
          weight: 1

        - name: "Blog"
          pageRef: /blog
          weight: 2

        - name: "Categorias"
          pageRef: /categories
          weight: 3

        - name: "Documentação"
          pageRef: /docs
          weight: 4

        - name: "Sobre"
          pageRef: /about
          weight: 5

        - name: "GitHub ↗"
          url: "https://github.com/jphs682"
          weight: 6


taxonomies:
  category: categories
  tag: tags


outputs:
  home:
    - HTML
    - RSS


module:
  imports:
    - path: github.com/imfing/hextra


markup:

  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false


params:

  description: >
    Diário de um Computador — crônicas, estudos e descobertas
    sobre Linux, programação, código aberto e tecnologia.

  author:
    name: "João Paulo"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    default: light


  editURL:
    enable: false

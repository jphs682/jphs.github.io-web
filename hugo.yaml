baseURL: "https://jphs682.github.io/jphs.github.io-web/"

languageCode: "pt-br"
locale: "pt-BR"
defaultContentLanguage: "pt-br"

title: "Diário de um Computador"

enableEmoji: true

languages:
  pt-br:
    languageName: "Português"
    weight: 1

    menu:
      main:

        - name: "Início"
          pageRef: /
          weight: 1

        - name: "Blog"
          pageRef: /blog
          weight: 2

        - name: "Categorias"
          pageRef: /categories
          weight: 3

        - name: "Documentação"
          pageRef: /docs
          weight: 4

        - name: "Sobre"
          pageRef: /about
          weight: 5

        - name: "GitHub ↗"
          url: "https://github.com/jphs682"
          weight: 6

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

params:

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    default: light

  author:
    name: "João Paulo"

  description: "Crônicas, estudos e descobertas sobre Linux, programação, código aberto e tecnologia."

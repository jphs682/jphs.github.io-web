baseURL: "https://jphs682.github.io/jphs.github.io-web/"

title: "Diário de um Computador"

defaultContentLanguage: "pt-br"
enableEmoji: true

languages:
  pt-br:
    label: "Português"
    locale: "pt-BR"
    weight: 1

    menu:
      main:

        - name: "Início"
          pageRef: /
          weight: 1

        - name: "Blog"
          pageRef: /blog
          weight: 2

        - name: "Categorias"
          pageRef: /categories
          weight: 3

        - name: "Documentação"
          pageRef: /docs
          weight: 4

        - name: "Sobre"
          pageRef: /about
          weight: 5

        - name: Search
          weight: 6
          params:
            type: search

        - name: GitHub
          url: "https://github.com/jphs682"
          weight: 7
          params:
            icon: github


taxonomies:
  category: categories
  tag: tags


outputs:
  home:
    - HTML
    - RSS


module:
  imports:
    - path: github.com/imfing/hextra


markup:

  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false


params:

  description: >
    Diário de um Computador — crônicas, estudos e descobertas
    sobre Linux, programação, código aberto e tecnologia.

  author:
    name: "João Paulo"
    email: "jphs@discente.ifpe.edu.br"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    default: system
    displayToggle: true

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
